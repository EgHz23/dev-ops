version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-avichron
    environment:
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: harvey7298   # TEST ONLY
      POSTGRES_DB: reporting_db
      TZ: Europe/Ljubljana
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Admin -d reporting_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      avichron-net:
        aliases:
          - postgres

  backend:
    image: ghcr.io/eghz23/reporting-backend:latest
    container_name: reporting-backend
    # env_file zahteva, da /vagrant/infra/.env obstaja
    env_file:
      - .env
    environment:
      TZ: Europe/Ljubljana
      RUN_SCHEDULER: "0"
      DATABASE_URL: postgresql://Admin:harvey7298@postgres:5432/reporting_db
      WEB_CONCURRENCY: "3"
      WEB_THREADS: "2"
      GUNICORN_TIMEOUT: "900"
      ZABBIX_SUPPRESS_TLS_WARNINGS: "1"
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET}
      LOCAL_JWT_ISSUER: ${LOCAL_JWT_ISSUER}
      LOCAL_JWT_AUDIENCE: ${LOCAL_JWT_AUDIENCE}
      LOCAL_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD}
      LOCAL_ADMIN_PASSWORD_HASH: ${LOCAL_ADMIN_PASSWORD_HASH}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL}
      LOCAL_ADMIN_NAME: ${LOCAL_ADMIN_NAME}
      FERNET_KEY: ${FERNET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PROXY_TRUSTED_HOSTS: ${PROXY_TRUSTED_HOSTS}
    volumes:
      - ./audit-logs:/app/logs
      - ./generated-reports:/app/generated_reports
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - avichron-net

  scheduler:
    image: ghcr.io/eghz23/reporting-backend:latest
    container_name: reporting-scheduler
    env_file:
      - .env
    environment:
      TZ: Europe/Ljubljana
      RUN_SCHEDULER: "1"
      SCHEDULER_MAX_CONCURRENCY: "3"
      DATABASE_URL: postgresql://Admin:harvey7298@postgres:5432/reporting_db
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET}
      LOCAL_JWT_ISSUER: ${LOCAL_JWT_ISSUER}
      LOCAL_JWT_AUDIENCE: ${LOCAL_JWT_AUDIENCE}
      LOCAL_ADMIN_USERNAME: ${LOCAL_ADMIN_USERNAME}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD}
      LOCAL_ADMIN_PASSWORD_HASH: ${LOCAL_ADMIN_PASSWORD_HASH}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL}
      LOCAL_ADMIN_NAME: ${LOCAL_ADMIN_NAME}
      FERNET_KEY: ${FERNET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PROXY_TRUSTED_HOSTS: ${PROXY_TRUSTED_HOSTS}
    command: >
      bash -lc "python -c \"import asyncio; from services.scheduler import scheduler;
      asyncio.run(scheduler.run_scheduler())\""
    volumes:
      - ./audit-logs:/app/logs
      - ./generated-reports:/app/generated_reports
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - avichron-net

  frontend:
    image: ghcr.io/eghz23/reporting-frontend:latest
    container_name: reporting-frontend
    environment:
      TZ: Europe/Ljubljana
    restart: unless-stopped
    networks:
      - avichron-net

  nginx:
    image: nginx:alpine
    container_name: nginx-avichron
    environment:
      TZ: Europe/Ljubljana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:Z
      - ./ssl:/etc/ssl
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - avichron-net

networks:
  avichron-net:
    driver: bridge

volumes:
  pgdata