version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-avichron
    environment:
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: harvey7298   # TEST ONLY
      POSTGRES_DB: reporting_db
      TZ: Europe/Ljubljana
    volumes:
      - ./backup/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Admin -d reporting_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      avichron-net:
        aliases:
          - postgres

  backend:
    image: ghcr.io/EgHz23/reporting-backend:latest
    container_name: reporting-backend
    env_file:
      - .env
    environment:
      TZ: Europe/Ljubljana
      RUN_SCHEDULER: "0"
      DATABASE_URL: postgresql://Admin:harvey7298@postgres:5432/reporting_db
      WEB_CONCURRENCY: "3"
      WEB_THREADS: "2"
      GUNICORN_TIMEOUT: "900"
      ZABBIX_SUPPRESS_TLS_WARNINGS: "1"
    volumes:
      - ./audit-logs:/app/logs
      - ./generated-reports:/app/generated_reports
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - avichron-net

  scheduler:
    image: ghcr.io/EgHz23/reporting-backend:latest
    container_name: reporting-scheduler
    env_file:
      - .env
    environment:
      TZ: Europe/Ljubljana
      RUN_SCHEDULER: "1"
      SCHEDULER_MAX_CONCURRENCY: "3"
      DATABASE_URL: postgresql://Admin:harvey7298@postgres:5432/reporting_db
    command: >
      bash -lc "python -c \"import asyncio; from services.scheduler import scheduler;
      asyncio.run(scheduler.run_scheduler())\""
    volumes:
      - ./audit-logs:/app/logs
      - ./generated-reports:/app/generated_reports
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - avichron-net

  frontend:
    image: ghcr.io/EgHz23/reporting-frontend:latest
    container_name: reporting-frontend
    environment:
      TZ: Europe/Ljubljana
      # frontend talks to backend via nginx (/api), not directly
    restart: unless-stopped
    networks:
      - avichron-net

  nginx:
    image: nginx:alpine
    container_name: nginx-avichron
    environment:
      TZ: Europe/Ljubljana
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:Z
      - ./ssl:/etc/ssl
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - avichron-net

networks:
  avichron-net:
    driver: bridge
