- hosts: reportvm
  become: true

  vars:
    # Where the dev-ops repo will live on the VM
    app_root: "/opt/reportapp"

    # Your dev-ops repo URL (recommended: public repo without secrets)
    # If private, use SSH deploy key or token via Ansible Vault / env var.
    repo_url: "https://github.com/EgHz23/dev-ops.git"
    repo_version: "main"

    # Where docker-compose project is on the VM
    # Expecting: /opt/reportapp/infra/docker-compose.yml, /opt/reportapp/infra/conf.d/default.conf, ...
    compose_project_dir: "{{ app_root }}/vagrant/infra"

    # Timezone
    tz: "Europe/Ljubljana"

    # GHCR auth (best practice: pass GHCR_TOKEN via environment)
    ghcr_username: "eghz23"
    ghcr_token: "{{ lookup('ansible.builtin.env', 'GHCR_TOKEN') | default('ghp_TOKEN', true) }}"

    # TLS (self-signed cert, mounted into nginx container)
    ssl_dir: "{{ compose_project_dir }}/ssl"
    ssl_cert: "{{ ssl_dir }}/cert.pem"
    ssl_key: "{{ ssl_dir }}/private.key"

    # Bind-mount directories for app data / config
    audit_logs_dir: "{{ compose_project_dir }}/audit-logs"
    generated_reports_dir: "{{ compose_project_dir }}/generated-reports"
    nginx_conf_dir: "{{ compose_project_dir }}/conf.d"

  tasks:
    # ----------------------------------------------------------------------
    # OS base setup
    # ----------------------------------------------------------------------
    - name: Nastavi timezone
      timezone:
        name: "{{ tz }}"

    - name: Namesti osnovne pakete (git, ca-certificates, curl, gnupg, openssl)
      apt:
        name:
          - git
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - openssl
        state: present
        update_cache: yes

    # ----------------------------------------------------------------------
    # Docker Engine + Compose plugin + Buildx
    # ----------------------------------------------------------------------
#    - name: Dodaj Docker GPG key
#      ansible.builtin.shell: |
#        install -m 0755 -d /etc/apt/keyrings
#        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
#        chmod a+r /etc/apt/keyrings/docker.gpg
#      args:
#        executable: /bin/bash

    - name: Dodaj Docker repo (Ubuntu 22.04 Jammy, amd64)
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable

    - name: Namesti Docker engine in compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Poskrbi, da docker teče in je enable-an
      service:
        name: docker
        state: started
        enabled: true

    # ----------------------------------------------------------------------
    # Pull Infra-as-Code repo onto VM (so infra/ exists here)
    # ----------------------------------------------------------------------
    - name: Ustvari app root direktorij
      file:
        path: "{{ app_root }}"
        state: directory
        mode: "0755"

    - name: Kloniraj ali posodobi dev-ops repo (Infra as Code)
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_root }}"
        version: "{{ repo_version }}"
        force: yes
        update: yes

    - name: Fail if repo content is missing (docker-compose + nginx conf)
      stat:
        path: "{{ item }}"
      loop:
        - "{{ compose_project_dir }}/docker-compose.yml"
        - "{{ nginx_conf_dir }}/default.conf"
      register: required_files

    - name: Abort if required files are missing
      fail:
        msg: "Repo content not present on VM. Missing: {{ required_files.results | selectattr('stat.exists','equalto',false) | map(attribute='item') | list }}"
      when: required_files.results | selectattr('stat.exists','equalto',false) | list | length > 0

    # ----------------------------------------------------------------------
    # Ensure expected directories exist BEFORE files are created
    # ----------------------------------------------------------------------
    - name: Ustvari direktorije (logs, reports, nginx conf, ssl)
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ audit_logs_dir }}"
        - "{{ generated_reports_dir }}"
        - "{{ nginx_conf_dir }}"
        - "{{ ssl_dir }}"

    - name: Ustvari prazno .env datoteko, če še ne obstaja
      copy:
        dest: "{{ compose_project_dir }}/.env"
        content: ""
        force: no
        mode: "0600"

    # ----------------------------------------------------------------------
    # Validate nginx configs exist in repo
    # ----------------------------------------------------------------------
    - name: Preveri, da nginx conf datoteke obstajajo
      stat:
        path: "{{ nginx_conf_dir }}/{{ item }}"
      loop:
        - default.conf
      register: nginx_conf_files

    - name: Fail, če nginx conf datoteke manjkajo
      fail:
        msg: "Manjkajo nginx conf datoteke v {{ nginx_conf_dir }} (default.conf)."
      when: nginx_conf_files.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    # ----------------------------------------------------------------------
    # TLS: self-signed cert for nginx (mounted into container)
    # ----------------------------------------------------------------------
    - name: Ustvari self-signed TLS cert, če še ne obstaja
      shell: |
        if [ -f "{{ ssl_cert }}" ] && [ -f "{{ ssl_key }}" ]; then
          exit 0
        fi
        openssl req -x509 -nodes -newkey rsa:2048 \
          -keyout "{{ ssl_key }}" \
          -out "{{ ssl_cert }}" \
          -days 365 \
          -subj "/CN=report-app.local"
      args:
        executable: /bin/bash

    # ----------------------------------------------------------------------
    # Docker Compose: pull & up
    # ----------------------------------------------------------------------
    - name: Preveri, da docker-compose.yml obstaja
      stat:
        path: "{{ compose_project_dir }}/docker-compose.yml"
      register: compose_file

    - name: Fail, če docker-compose.yml ne obstaja
      fail:
        msg: "Datoteka {{ compose_project_dir }}/docker-compose.yml ne obstaja. Preveri repo strukturo."
      when: not compose_file.stat.exists

    - name: Prijava v GHCR registry
      ansible.builtin.command: >
        docker login ghcr.io
        -u {{ ghcr_username }}
        -p {{ ghcr_token }}
      no_log: true

    - name: docker compose pull (potegni zadnje image iz registry - CI/CD del)
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ compose_project_dir }}"

    - name: Zaženi cel stack (nginx, frontend, backend, scheduler, postgres)
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ compose_project_dir }}"
