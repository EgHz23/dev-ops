- hosts: reportvm
  become: true

  vars:
    # Kje je docker-compose projekt na VM (Vagrant synced folder)
    compose_project_dir: "/vagrant/infra"

    # Timezone
    tz: "Europe/Ljubljana"

    # TLS (za nginx container – volume z self-signed certom)
    ssl_dir: "{{ compose_project_dir }}/ssl"
    ssl_cert: "{{ ssl_dir }}/cert.pem"
    ssl_key: "{{ ssl_dir }}/private.key"

    # Volume direktoriji (morajo obstajati, če jih uporablja docker-compose.yml)
    audit_logs_dir: "{{ compose_project_dir }}/audit-logs"
    generated_reports_dir: "{{ compose_project_dir }}/generated-reports"
    pgdata_dir: "{{ compose_project_dir }}/backup/pgdata"
    nginx_conf_dir: "{{ compose_project_dir }}/conf.d"

  tasks:
    # ----------------------------------------------------------------------
    # OS osnovna nastavitev
    # ----------------------------------------------------------------------
    - name: Nastavi timezone
      timezone:
        name: "{{ tz }}"

    - name: Namesti osnovne pakete (git, ca-certificates, curl, gnupg)
      apt:
        name:
          - git
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    # ----------------------------------------------------------------------
    # Namestitev Docker + Docker Compose plugin
    # ----------------------------------------------------------------------
    - name: Dodaj Docker GPG key
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        executable: /bin/bash
      register: docker_gpg
      changed_when: docker_gpg.rc == 0

    - name: Dodaj Docker repo
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/$(. /etc/os-release && echo "$ID") $(lsb_release -cs) stable

    - name: Namesti Docker engine in compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Poskrbi, da docker teče in je enable-an
      service:
        name: docker
        state: started
        enabled: true

    # ----------------------------------------------------------------------
    # Priprava volume direktorijev, ki jih uporablja docker-compose.yml
    # ----------------------------------------------------------------------
    - name: Ustvari volume direktorije (logs, reports, pgdata, nginx conf/ssl)
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ audit_logs_dir }}"
        - "{{ generated_reports_dir }}"
        - "{{ pgdata_dir }}"
        - "{{ nginx_conf_dir }}"
        - "{{ ssl_dir }}"

    # ----------------------------------------------------------------------
    # Preveri, da nginx conf datoteke obstajajo v infra/conf.d
    # ----------------------------------------------------------------------
    - name: Preveri, da nginx conf datoteke obstajajo
      stat:
        path: "{{ nginx_conf_dir }}/{{ item }}"
      loop:
        - default.conf
        # če timeout.conf ne obstaja, odstrani to linijo ali ga dodaj v repo
        # - timeout.conf
      register: nginx_conf_files

    - name: Fail, če nginx conf datoteke manjkajo
      fail:
        msg: "Manjkajo nginx conf datoteke v {{ nginx_conf_dir }} (default.conf, timeout.conf?)."
      when: nginx_conf_files.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    # ----------------------------------------------------------------------
    # TLS: self-signed cert za nginx (mount v containerju)
    # ----------------------------------------------------------------------
    - name: Ustvari self-signed TLS cert, če še ne obstaja
      shell: |
        if [ -f "{{ ssl_cert }}" ] && [ -f "{{ ssl_key }}" ]; then
          exit 0
        fi
        openssl req -x509 -nodes -newkey rsa:2048 \
          -keyout "{{ ssl_key }}" \
          -out "{{ ssl_cert }}" \
          -days 365 \
          -subj "/CN=report-app.local"
      args:
        executable: /bin/bash

    # ----------------------------------------------------------------------
    # Docker Compose: pull & up celotnega stacka
    # ----------------------------------------------------------------------
    - name: Preveri, da docker-compose.yml obstaja
      stat:
        path: "{{ compose_project_dir }}/docker-compose.yml"
      register: compose_file

    - name: Fail, če docker-compose.yml ne obstaja
      fail:
        msg: "Datoteka {{ compose_project_dir }}/docker-compose.yml ne obstaja. Poskrbi, da je v infra/."
      when: not compose_file.stat.exists

    - name: docker compose pull (potegni zadnje image iz registry - CI/CD del)
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ compose_project_dir }}"

    - name: Zaženi cel stack (nginx, frontend, backend, scheduler, postgres)
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ compose_project_dir }}"
